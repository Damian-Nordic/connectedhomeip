name: Release Android packages

on:
    workflow_dispatch:
        inputs:
            commit:
                description: Commit SHA or release tag
                required: true
            publishRelease:
                description: Publish release packages. Requires that 'commit' contain a release tag name.
                requred: true
                default: "false"            

jobs:
    android:
        name: Build Android
        timeout-minutes: 60

        runs-on: ubuntu-latest

        env:
            JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64/

        container:
            image: connectedhomeip/chip-build-android:latest
            volumes:
                - "/tmp/log_output:/tmp/test_logs"
                - "/tmp/output_binaries:/tmp/output_binaries"

        steps:
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  ref: "${{ github.event.inputs.commit }}"
                  submodules: true
            - name: Bootstrap
              timeout-minutes: 10
              run: scripts/build/gn_bootstrap.sh
            - name: Build arm CHIPTool
              timeout-minutes: 10
              env:
                  BUILD_TYPE: android_arm
                  TARGET_CPU: arm
              run: |
                  ./scripts/examples/android_app.sh
                  yes | "$ANDROID_HOME"/tools/bin/sdkmanager --licenses
                  cd src/android/CHIPTool
                  ./gradlew build
                  cp app/build/outputs/apk/debug/app-debug.apk /tmp/output_binaries/chiptool-arm.apk
            - name: Build arm64 CHIPTool
              timeout-minutes: 10
              env:
                  BUILD_TYPE: android_arm64
                  TARGET_CPU: arm64
              run: |
                  ./scripts/examples/android_app.sh
                  yes | "$ANDROID_HOME"/tools/bin/sdkmanager --licenses
                  cd src/android/CHIPTool
                  ./gradlew build
                  cp app/build/outputs/apk/debug/app-debug.apk /tmp/output_binaries/chiptool-arm64.apk
            - name: Build x64 CHIPTool
              timeout-minutes: 10
              env:
                  BUILD_TYPE: android_x64
                  TARGET_CPU: x64
              run: |
                  ./scripts/examples/android_app.sh
                  yes | "$ANDROID_HOME"/tools/bin/sdkmanager --licenses
                  cd src/android/CHIPTool
                  ./gradlew build
                  cp app/build/outputs/apk/debug/app-debug.apk /tmp/output_binaries/chiptool-x64.apk
            - name: Upload artifacts
              uses: actions/upload-artifact@v2
              with:
                  name: chiptool
                  path: /tmp/output_binaries/chiptool-*.apk
            - name: Upload release packages
              uses: softprops/action-gh-release@v1
              if: github.event.inputs.publishRelease == 'true'
              with:
                  files: /tmp/output_binaries/chiptool-*.apk
                  fail_on_unmatched_files: true
                  tag_name: "${{ github.event.inputs.commit }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
