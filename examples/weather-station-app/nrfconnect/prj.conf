# This sample uses sample-defaults.conf to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Add support for LEDs and buttons
CONFIG_DK_LIBRARY=y

# OpenThread overrides
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=64

# Bluetooth overrides
CONFIG_BT_DEVICE_NAME="ChipWeather"

# Additional configs for debbugging experience
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y

# CHIP configuration
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
